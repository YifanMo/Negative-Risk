[server]
host = "127.0.0.1"
port = 8010

[gamma]
base_url = "https://gamma-api.polymarket.com"
page_size = 500

[clob]
ws_url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
rest_url = "https://clob.polymarket.com"

[execution]
enabled = false

[history]
lookback_hours = 24
fidelity_minutes = 5
batch_size = 20
max_events = 100
cache_ttl_secs = 300
book_db_path = "data/negrisk_book_history.sqlite"
snapshot_interval_secs = 5
retention_hours = 72
max_snapshot_events = 100
max_book_age_secs = 30
pmxt_cache_dir = "data/pmxt_cache"

[engine]
event_refresh_secs = 300
scan_interval_ms = 250
min_event_liquidity = 0.0
max_markets_per_event = 60
max_events = 500
ws_chunk_size = 400
ws_reconnect_secs = 3

[arb]
min_gross_profit = 0.01
min_total_usd = 2.0
cooldown_secs = 120
max_depth_pct = 0.5
